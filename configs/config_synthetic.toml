[train]
[train.trainer]
max_epochs = 200
accelerator = "auto"
gradient_clip_val = 1.0

[train.early_stopping]
enabled = false
monitor = "early_stop_loss/dataloader_idx_1"
mode = "min"
patience = 50

[data]
data_dir = "../data/synthetic/dynasurv_full"
subtype = "HR+HER2-"
n_lines = 4
batch_size = 128

[eval]
horizon_times = [100, 75, 50, 30]
integration_step = 100
