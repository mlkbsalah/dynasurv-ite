[train]
[train.trainer]
max_epochs = 100

[train.early_stopping]
# Stop on marginal calibration, not on the survival NLL. Across an lr sweep
# (1e-3/3e-4/1e-4) and an n_intervals sweep (100/70/50/30), val_loss bottomed at
# epoch 5-27 and then degraded while calib_gap_abs_mean kept falling to the last
# epoch of nearly every run -- so stopping on val_loss ended training while the
# quantity we care about was still improving. Note val_loss is also not
# comparable across n_intervals (it sums per-interval NLL terms), whereas the
# calibration gap is a survival-probability difference and is.
#
# This key used to be ignored: the script hardcoded monitor="val_loss". It is
# now read (TrainDynasurvCausal.py), so editing it here changes the run.
monitor = "val/calib_gap_abs_mean"
mode = "min"
patience = 10

[data]
data_dir = "../data"
subtype = "HR+HER2-"
n_lines = 4

# NOTE: batch_size and n_intervals are NOT here. Both are datamodule inputs that
# the Optuna study tunes, so they live together in configs/best_config.json.
# Splitting them -- n_intervals in the tuned file, batch_size here -- is what let
# the study's winning batch_size be silently replaced by this file's value.

# --- Identifiability controls (see improvements.md) ---
# Keep only patients whose FIRST line starts in/after this year, so every arm in
# the action set was available across the whole window. CDK4/6 inhibitors did
# not exist before ~2014 and bevacizumab-based CT+ANTI-ANGIO all but vanished
# after 2016; pooling those eras makes the propensity model assign a 2010
# patient a sizeable probability of a drug that did not yet exist.
cohort_start_year = 2018

# Hold out the latest entry years rather than a random subset, so validation
# measures generalisation across treatment-policy eras.
#
# 2021 rather than 2022: the holdout is by construction the least-followed part
# of the cohort, and a 2022 cutoff leaves it with ~26 months of administrative
# follow-up at most. At that cutoff NO line has a usable horizon (0% of line-2
# holdout records reach 24 months, 0% of line-4 records reach 18), so every
# RMST figure would be extrapolation past the last observation. 2021 keeps
# 67% of line-1 holdout records to 24 months and gives a 68/32 split.
temporal_split_year = 2021

# Expose calendar time to the encoder. Safe only inside the restricted window,
# where it is an ordinary confounder rather than a determinant of availability.
add_calendar_feature = true

# Arms excluded from the recommendable action set. Records are retained (they
# inform patient history); only their eligibility to be recommended is removed.
# NO TREATMENT: 207/0/0/1 across lines - a line-1 coding artefact, not a therapy.
# OTHER / ET+TT: 736 and 344 distinct regimens, modal share 0.16 - not a single
# well-defined intervention.
excluded_treatment_arms = ["NO TREATMENT", "OTHER", "ET+TT"]

# X_ columns dropped from the encoder's feature set entirely (not merely from
# recommendation, unlike excluded_treatment_arms above). X_onset_to_progression
# IS the current line's duration (corr 1.000 with observed line length) -- a
# post-treatment mediator on the A_k -> O_k path, not a baseline covariate.
# See reports/project_state_report.md sec 7(1). Leaving this unset falls back
# to the same default in datamodule_cv.py; set explicitly to [] only for a
# deliberate re-leak ablation.
excluded_x_columns = ["X_onset_to_progression"]

# An arm must clear this many observations at a line to be recommendable there.
min_samples_per_treatment = 200
# Beyond raw counts, require outcome information relevant to each line's RMST
# horizon. A death before tau establishes zero survival thereafter; a censored
# record only contributes if observed through tau.
min_events_per_treatment = 30
min_followup_samples_per_treatment = 100
# Patient-specific overlap floor.  Set to zero to audit propensities without
# masking recommendations; tune from the resulting ESS/low-propensity reports.
propensity_min_probability = 0.01
propensity_cv_folds = 5

[eval]
# Per-line horizons in months. These are set by what the HOLDOUT can support,
# not the cohort as a whole: the holdout is the latest-entering patients, so it
# always has the least follow-up, and a horizon the full cohort supports can be
# pure extrapolation there. Share of holdout records (entry 2021+, DB lock
# 2024-02) whose administrative follow-up reaches each horizon:
#   line 1, tau=24: 67.1%    line 2, tau=18: 46.2%
#   line 3, tau=12: ~50%     line 4, tau=12: ~40%
# The original [100, 75, 50, 30] was not estimable at all here; even [36,30,24,24]
# was unsupported once the temporal holdout was taken into account.
horizon_times = [24, 18, 12, 12]
integration_step = 100 # the dx in the trapezoidal rule for integrating Brier score over time

# Landmarks (months) for the per-line calibration gap logged each validation epoch:
# mean predicted S(t) minus the Kaplan-Meier S(t) of the same risk set. Applied to
# every line; a landmark past a line's last observed time is skipped, so line 4
# contributes only the early ones. Kept independent of horizon_times, which is a
# per-line integration limit for the Brier score rather than a reporting grid.
calibration_times = [6, 12, 24, 36]

[recommendation]
# Decision rule of the ensemble recommender (scripts/RecommendEnsemble.py). Every
# member is a checkpoint trained on the same temporal split with a different
# init; per patient, line and arm the ensemble gives a mean RMST, a std over
# members, and p_best = the share of members in which the arm is the best
# supported one.
#
# Leader = argmax over supported arms of `mean - pessimism_c * std` ("lcb", the
# offline-bandit pessimism rule: an arm the members disagree about is penalised)
# or of the mean alone ("mean").
#
# The leader is *recommended* only when both hold:
#   1. no other supported arm is within margin_months of it once the paired
#      difference is shrunk by pessimism_c * its std (the equivalence set is a
#      singleton), and
#   2. p_best(leader) >= p_best_min.
# Otherwise the output is the equivalence set and the decision is "undecided".
# p_best takes values in multiples of 1/M: with 3 members, 0.7 means unanimity;
# with 10 members it means 7 of 10; with the 20 seeds slurm/TrainSeeds.sh
# launches by default it means 14 of 20.
p_best_min = 0.7
margin_months = 1.0
pessimism_c = 1.0
leader_rule = "lcb"
# Which ModelCheckpoint file of each run to ensemble: val_loss | bestCI | bestIBS |
# bestCALIB | final_epoch. bestCALIB exists only for runs after 2026-09-07.
checkpoint_kind = "val_loss"
min_members = 2
